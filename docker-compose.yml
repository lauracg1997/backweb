services:
  backend:
    build: .
    env_file: .env.production
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../talentionhr-cms
    ports:
      - "8081:80"
    volumes:
      - storage_data:/var/storage/app
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentionhr
      POSTGRES_USER: talentionhr
      POSTGRES_PASSWORD: TalentionHR2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentionhr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
